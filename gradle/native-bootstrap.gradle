        }
    }
}

def forwardDirectory = layout.buildDirectory.dir('native-forward-test-run')
def prepareForward = tasks.register('prepareNativeForwardTest') {
    dependsOn bootstrapJar
    doLast {
        File target = forwardDirectory.get().asFile
        if (target.canonicalFile != new File(buildDir, 'native-forward-test-run').canonicalFile) {
            throw new GradleException('Forward checks must stay inside their build directory')
        }
        if (target.exists()) throw new GradleException('Preserve the existing forward-upgrade evidence before starting another run: ' + target)
        copy { from 'src/bootstrapTest/defaultconfigs'; into target }
        copy { from zipTree('src/testFixtures/worlds/building-pieces-1.12.2.zip'); into new File(target, 'world') }
        copy { from 'src/testFixtures/worlds/building-pieces-1.12.2.json'; into target; rename { 'forward-fixture.json' } }
        copy { from bootstrapJar.flatMap { it.archiveFile }; into new File(target, 'mods') }
        new File(target, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'server.properties').text = '''level-name=world
online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
spawn-animals=false
spawn-monsters=false
max-tick-time=120000
'''
    }
}
def forwardPhases = [:]
['forward', 'forward-reload'].each { phase ->
    forwardPhases[phase] = tasks.register('native' + phase.split('-').collect { it.capitalize() }.join('') + 'Process', JavaExec) {
        dependsOn phase == 'forward' ? prepareForward : forwardPhases.forward
        workingDir forwardDirectory
        systemProperty 'skysbuildingpieces.bootstrapPhase', phase
        project.ext.configureNativeBootstrapRun(delegate, 'runServer')
        doLast {
            auditServerLogs(forwardDirectory.get().asFile, phase)
            File log = new File(forwardDirectory.get().asFile, 'logs/latest.log')
            String text = log.isFile() ? readForgeRuntimeLog(log) : ''
            if (!text.contains('BUILDING_PIECES_NATIVE_FORWARD_PASS') ||
                    !text.contains('BUILDING_PIECES_NATIVE_BOOTSTRAP_PASS ' + phase) ||
                    !text.contains('Done (') || text =~ /(?m)\[[^\r\n]*\/(?:ERROR|FATAL)\]/ ||
                    text.contains('[STDERR/') || text.contains('Encountered an unexpected exception') ||
                    !fileTree(new File(forwardDirectory.get().asFile, 'crash-reports')).isEmpty()) {
                throw new GradleException('Forward upgrade did not complete cleanly: ' + phase)
            }
        }
    }
}
tasks.register('nativeForwardTest') { dependsOn forwardPhases['forward-reload'] }

def clientRunName = providers.gradleProperty('nativeClientRunName').getOrElse('native-client-test-run')
if (!(clientRunName ==~ /[a-z0-9-]+/)) {
    throw new GradleException('Use a simple disposable client directory name')
}
def clientDirectory = layout.buildDirectory.dir(clientRunName)
def prepareClient = tasks.register('prepareNativeClientTest') {
    dependsOn bootstrapJar
    if (providers.gradleProperty('nativeGrass').getOrElse('false').toBoolean()) {
        dependsOn tasks.named('verifyGrassSlabsRelease')
    }
    if (providers.gradleProperty('nativeMineralogy').getOrElse('false').toBoolean()) {
        dependsOn project.ext.verifyNativeOptionalRuntime
    }
    doLast {
        File target = clientDirectory.get().asFile
        if (target.canonicalFile != new File(buildDir, clientRunName).canonicalFile) {
            throw new GradleException('Client checks must stay inside their build directory')
        }
        if (target.exists()) throw new GradleException('Preserve the existing client evidence before starting another run: ' + target)
        copy { from bootstrapJar.flatMap { it.archiveFile }; into new File(target, 'mods') }
        if (providers.gradleProperty('nativeGrass').getOrElse('false').toBoolean()) {
            copy { from project.ext.nativeGrassDevelopmentJar; into new File(target, 'mods') }
        }
        if (providers.gradleProperty('nativeMineralogy').getOrElse('false').toBoolean()) {
            copy { from project.ext.nativeOptionalDevelopmentJars.values(); into new File(target, 'mods') }
        }
        // Set native defaults before Forge's configuration watcher starts. The
        // failed first-start receipt remains part of the qualification evidence.
        copy { from 'src/bootstrapTest/defaultconfigs'; into target }
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'options.txt').text = 'lang:en_us\nfullscreen:false\nrenderDistance:2\npauseOnLostFocus:false\n'
    }
}
// ForgeGradle supplies BootstrapLauncher and its module path. Keep the
// build-only probe in this disposable mods folder, outside ordinary runs.
def clientPhases = [:]
['client-fresh', 'client-reload'].each { phase ->
    clientPhases[phase] = tasks.register('native' + phase.split('-').collect { it.capitalize() }.join('') + 'Process', JavaExec) {
        dependsOn phase == 'client-fresh' ? prepareClient : clientPhases['client-fresh']
        workingDir clientDirectory
        systemProperty 'skysbuildingpieces.bootstrapPhase', phase
        args '--accessToken', '0'
        project.ext.configureNativeBootstrapRun(delegate, 'runClient')
        doLast {
            logger.lifecycle(providers.exec {
                commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                        file('tools/native_client_log.py'), '--directory', clientDirectory.get().asFile,
                        '--phase', phase, '--offline-client'
            }.standardOutput.asText.get().trim())
        }
    }
}

tasks.register('nativeClientTest') { dependsOn clientPhases['client-reload'] }
