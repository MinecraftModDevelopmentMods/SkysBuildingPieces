// This probe is excluded from ordinary runs and from all production artifacts.
def auditServerLogs = { File directory, String phase ->
    logger.lifecycle(providers.exec {
        commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                file('tools/native_client_log.py'), '--server', '--directory', directory,
                '--phase', phase
    }.standardOutput.asText.get().trim())
}
ext.auditNativeServerLogs = auditServerLogs

