def bootstrapJar = tasks.register('nativeBootstrapProbeJar', Jar) {
    dependsOn compileBootstrap
    archiveFileName = 'building-pieces-native-checks.jar'
    destinationDirectory = layout.buildDirectory.dir('native-bootstrap-probe')
    from bootstrapClasses
    from 'src/bootstrapTest/resources'
}

def packagedBootstrap = bootstrapJar
tasks.register('preparePackagedNativeProbe') { dependsOn packagedBootstrap }
def bootstrapRunName = providers.gradleProperty('nativeBootstrapRunName')
        .getOrElse('native-bootstrap-test-run')
if (!(bootstrapRunName ==~ /[a-z0-9-]+/)) {
    throw new GradleException('Use a simple disposable bootstrap directory name')
}
def directory = layout.buildDirectory.dir(bootstrapRunName)
def prepare = tasks.register('prepareNativeBootstrapTest') {
    dependsOn bootstrapJar
    if (providers.gradleProperty('nativeGrass').getOrElse('false').toBoolean()) {
        dependsOn tasks.named('verifyGrassSlabsRelease')
    }
    if (providers.gradleProperty('nativeMineralogy').getOrElse('false').toBoolean()) {
        dependsOn project.ext.verifyNativeOptionalRuntime
    }
    doLast {
        File target = directory.get().asFile
        if (target.canonicalFile != new File(buildDir, bootstrapRunName).canonicalFile) {
            throw new GradleException('Bootstrap checks must stay inside the build directory')
        }
        if (target.exists()) throw new GradleException('Preserve the existing bootstrap evidence before starting another run: ' + target)
        copy { from 'src/bootstrapTest/defaultconfigs'; into target }
        copy { from bootstrapJar.flatMap { it.archiveFile }; into new File(target, 'mods') }
        if (providers.gradleProperty('nativeGrass').getOrElse('false').toBoolean()) {
            copy { from project.ext.nativeGrassDevelopmentJar; into new File(target, 'mods') }
        }
        if (providers.gradleProperty('nativeMineralogy').getOrElse('false').toBoolean()) {
            copy { from project.ext.nativeOptionalDevelopmentJars.values(); into new File(target, 'mods') }
            if (providers.gradleProperty('nativeMineralogySlabsDisabled').getOrElse('false').toBoolean()) {
                File configuration = new File(target, 'config/mineralogy-common.toml')
                configuration.parentFile.mkdirs()
                configuration.text = '[options]\nGENERATE_ROCKSLAB=false\n'
            }
        }
        new File(target, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'server.properties').text = '''level-name=world
level-seed=4815162342
online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
spawn-animals=false
spawn-monsters=false
max-tick-time=120000
'''
    }
}
def phases = [:]
['fresh', 'reload'].each { phase ->
    phases[phase] = tasks.register('nativeBootstrap' + phase.capitalize() + 'Process', JavaExec) {
        dependsOn phase == 'fresh' ? prepare : phases.fresh
        workingDir directory
        systemProperty 'skysbuildingpieces.bootstrapPhase', phase
        systemProperty 'skysbuildingpieces.expectMineralogySlabsDisabled',
                providers.gradleProperty('nativeMineralogySlabsDisabled').getOrElse('false')
        project.ext.configureNativeBootstrapRun(delegate, 'runServer')
        doLast {
            auditServerLogs(directory.get().asFile, phase)
            File marker = new File(directory.get().asFile, 'world/native-bootstrap.properties')
            if (!marker.isFile()) throw new GradleException('Native bootstrap marker is missing')
            Properties result = new Properties()
            marker.withInputStream { result.load(it) }
            if (result.getProperty(phase + '_complete') != 'true') {
                throw new GradleException('Native bootstrap did not finish: ' + phase)
            }
            File log = new File(directory.get().asFile, 'logs/latest.log')
            if (!log.isFile()) throw new GradleException('Native bootstrap log is missing')
            String text = readForgeRuntimeLog(log)
            if (!text.contains('BUILDING_PIECES_NATIVE_BOOTSTRAP_PASS ' + phase) ||
                    !text.contains('Done (') || text =~ /(?m)\[[^\r\n]*\/(?:ERROR|FATAL)\]/ ||
                    text.contains('[STDERR/') || text.contains('Encountered an unexpected exception')) {
                throw new GradleException('Native bootstrap log contains a failure or incomplete startup')
            }
            if (!fileTree(new File(directory.get().asFile, 'crash-reports')).isEmpty()) {
                throw new GradleException('Native bootstrap produced a crash report')
            }
        }
    }
}
tasks.register('nativeBootstrapTest') { dependsOn phases.reload }

tasks.register('nativeWaterloggingTest', JavaExec) {
    dependsOn prepare
    workingDir directory
    systemProperty 'skysbuildingpieces.bootstrapPhase', 'water'
    project.ext.configureNativeBootstrapRun(delegate, 'runServer')
    doLast {
        auditServerLogs(directory.get().asFile, systemProperties['skysbuildingpieces.bootstrapPhase'].toString())
        String log = readForgeRuntimeLog(new File(directory.get().asFile, 'logs/latest.log'))
        if (!log.contains('BUILDING_PIECES_WATERLOGGING_PASS') ||
                !log.contains('BUILDING_PIECES_NATIVE_BOOTSTRAP_PASS water') ||
                log =~ /\/(?:ERROR|FATAL)\]/ || log.contains('[STDERR/')) {
            throw new GradleException('Native waterlogging checks did not complete cleanly')
        }
    }
}

tasks.register('nativeStagingTest', JavaExec) {
    dependsOn prepare
    workingDir directory
    systemProperty 'skysbuildingpieces.bootstrapPhase', 'staging'
    project.ext.configureNativeBootstrapRun(delegate, 'runServer')
    doLast {
        auditServerLogs(directory.get().asFile, systemProperties['skysbuildingpieces.bootstrapPhase'].toString())
