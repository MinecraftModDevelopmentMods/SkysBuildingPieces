// Optional reference mods use SRG names in their public jars. Generate exact
// development copies only when requested; ordinary builds remain standalone.
if (!providers.gradleProperty('generateOptionalDevelopment').getOrElse('false').toBoolean()) {
    ext.prepareOfficialMineralogyDevelopment = tasks.register('prepareOfficialMineralogyDevelopment')
    return
}

def sourceSets = project.extensions.getByName('sourceSets')
def mappings = project.layout.buildDirectory.file('development-optional/srg-to-official.tsrg')
def runtimeLock = new Properties()
file('gradle/mineralogy-runtime.properties').withInputStream { runtimeLock.load(it) }
if (!runtimeLock.getProperty('runtime.available', 'true').toBoolean()) {
    throw new GradleException('No compatible Mineralogy and OreSpawn jars are pinned for this loader')
}
def dependencyCandidates = ['OreSpawn': 'orespawn', 'Mineralogy': 'mineralogy'].collectEntries { name, key ->
    [(name): [path: file(runtimeLock.getProperty(key + '.path')).path,
              sha256: runtimeLock.getProperty(key + '.sha256')]]
}
def mappingUtilities = configurations.create('optionalDevelopmentMappingUtilities') {
    canBeConsumed = false
    visible = false
}
dependencies.add(mappingUtilities.name, 'net.minecraftforge:srgutils:0.4.15')
def withMappingTypes = { operation ->
    new URLClassLoader(mappingUtilities.files.collect { it.toURI().toURL() } as URL[],
            ClassLoader.getPlatformClassLoader()).withCloseable { loader ->
        operation(loader.loadClass('net.minecraftforge.srgutils.IMappingFile'),
                loader.loadClass('net.minecraftforge.srgutils.IMappingFile$Format'))
    }
}
def digest = { File path ->
    java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes)
            .encodeHex().toString().toUpperCase(Locale.ROOT)
}
def reverseMappings = project.tasks.register('prepareOptionalDevelopmentMappings') {
    inputs.files(project.minecraft.dependency.toSrgFile)
    outputs.file(mappings)
    doLast {
        File source = project.files(project.minecraft.dependency.toSrgFile).singleFile
        File output = mappings.get().asFile
        output.parentFile.mkdirs()
        withMappingTypes { type, formatType ->
            def format = formatType.getField('TSRG').get(null)
            source.withInputStream { raw ->
                InputStream stream = source.name.endsWith('.gz') ? new java.util.zip.GZIPInputStream(raw) : raw
                type.load(stream).reverse().write(output.toPath(), format, false)
            }
        }
    }
}
def referenceTextPatterns = ['**/*.cfg', '**/*.html', '**/*.info', '**/*.java', '**/*.js',
        '**/*.json', '**/*.mcmeta', '**/*.md', '**/*.properties', '**/*.toml', '**/*.txt', '**/*.xml',
        '**/element-list', '**/package-list', '**/LICENSE', '**/LICENSE.spdx', '**/NOTICE']
def normalizeReferenceText = { details ->
    details.filter(org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'),
            eof: org.apache.tools.ant.filters.FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

def developmentArchives = []
dependencyCandidates.each { name, details ->
    File original = new File(details.path)
    if (digest(original) != details.sha256) throw new GradleException("Changed ${name} source jar")
    Map manifestValues = new java.util.jar.JarFile(original).withCloseable { archive ->
        archive.manifest.mainAttributes.collectEntries { key, value ->
            [(key.toString()): value.toString()]
        }
    }
    def originalAccessRules = new java.util.zip.ZipFile(original).withCloseable { archive ->
        def entry = archive.getEntry('META-INF/accesstransformer.cfg')
        entry == null ? null : archive.getInputStream(entry).getText('UTF-8')
    }
    def mappedAccessRules = project.layout.buildDirectory.file("development-optional/${name}-access.cfg")
    def accessTask = project.tasks.register("prepare${name}DevelopmentAccess") {
        dependsOn reverseMappings
        outputs.file(mappedAccessRules)
        doLast {
            if (originalAccessRules == null) return
            withMappingTypes { type, formatType ->
                def mapping = type.load(mappings.get().asFile)
                String converted = originalAccessRules.readLines().collect { line ->
                    List<String> words = line.trim().split(/\s+/) as List<String>
                    if (words.size() != 3) throw new GradleException("Unexpected ${name} access rule: ${line}")
                    def owner = mapping.getClass(words[1].replace('.', '/'))
                    if (owner == null) throw new GradleException("Missing ${name} access-rule owner")
                    String field = owner.remapField(words[2])
                    if (field == words[2]) throw new GradleException("Unmapped ${name} access rule: ${line}")
                    [words[0], owner.mapped.replace('/', '.'), field].join(' ')
                }.join('\n') + '\n'
                mappedAccessRules.get().asFile.setText(converted, 'UTF-8')
            }
        }
    }
    def inputJar = project.tasks.register("${name}DevelopmentInput", Jar) {
        inputs.file(original)
        archiveFileName = "${name}-development-input.jar"
        destinationDirectory = project.layout.buildDirectory.dir('development-optional')
        manifest.attributes(manifestValues)
        filesMatching(referenceTextPatterns, normalizeReferenceText)
        from(project.zipTree(original)) {
            exclude 'META-INF/MANIFEST.MF', 'META-INF/accesstransformer.cfg'
            exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        }
        doFirst {
            if (digest(original) != details.sha256) throw new GradleException("Changed ${name} source jar")
        }
    }
    def classesJar = project.layout.buildDirectory.file("development-optional/${name}-official-classes.jar")
    def remap = project.renamer.classes(inputJar) {
        map.from reverseMappings
        libraries.from sourceSets.main.compileClasspath
        naiveSrg = true
        accessTransformers = false
        output = classesJar
    }
    def finalJar = project.tasks.register("${name}DevelopmentJar", Jar) {
        dependsOn remap, accessTask
        archiveFileName = "${name}-official-development.jar"
        destinationDirectory = project.layout.buildDirectory.dir('development-optional')
        manifest.attributes(manifestValues)
        filesMatching(referenceTextPatterns, normalizeReferenceText)
        from { project.zipTree(classesJar.get().asFile) }
        exclude 'META-INF/MANIFEST.MF'
        if (originalAccessRules != null) {
            from(mappedAccessRules) {
                into 'META-INF'
                rename { 'accesstransformer.cfg' }
            }
        }
        doLast {
            if (digest(original) != details.sha256) throw new GradleException("Changed ${name} source jar")
        }
    }
    developmentArchives.add(finalJar)
}
ext.prepareOfficialMineralogyDevelopment = tasks.register('prepareOfficialMineralogyDevelopment') {
    group = 'ide'
    description = 'Creates mapped optional development jars from the exact pinned production jars.'
    dependsOn developmentArchives
}
