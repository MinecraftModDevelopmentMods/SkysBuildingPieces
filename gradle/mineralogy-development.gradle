import java.security.MessageDigest
import net.minecraftforge.srgutils.IMappingFile

buildscript {
    repositories {
        maven {
            url = 'https://maven.minecraftforge.net/'
            metadataSources { artifact() }
            content { includeModule('net.minecraftforge', 'srgutils') }
        }
    }
    dependencies { classpath 'net.minecraftforge:srgutils:0.4.15' }
}

// Derive the optional development jar from the exact packaged reference.
// The release jar stays unchanged and is used for packaged qualification.
def sourceJar = file(providers.gradleProperty('mineralogyMainJar').getOrElse(
        '../../../MinecraftMineralogy/MinecraftMineralogy 116/MinecraftMineralogy/build/libs/Mineralogy-6.1.4.116051.jar'))
def sourceHash = '6A46E7D24B9394F0BFBCE82E47E76CBC4DBA260DD3D7499F9B3A946029E8D7F7'
// Renamer adds its outputs to assemble. Without the optional source jar, leave
// ordinary builds alone and report the prerequisite only if that profile is requested.
if (!sourceJar.isFile()) {
    ext.prepareOfficialMineralogyDevelopment = tasks.register('prepareOfficialMineralogyDevelopment') {
        group = 'ide'
        doLast {
            throw new GradleException('The optional Mineralogy development profile needs its pinned main jar.')
        }
    }
    return
}

def mappings = layout.buildDirectory.file('development-dependencies/srg-to-official.tsrg')
def reverseMappings = tasks.register('prepareMineralogyOfficialMappings') {
    inputs.files(minecraft.dependency.toSrgFile)
    outputs.file(mappings)
    doLast {
        File source = files(minecraft.dependency.toSrgFile).singleFile
        File target = mappings.get().asFile
        target.parentFile.mkdirs()
        source.withInputStream { input ->
            InputStream stream = source.name.endsWith('.gz') ? new java.util.zip.GZIPInputStream(input) : input
            IMappingFile.load(stream).reverse().write(target.toPath(), IMappingFile.Format.TSRG, false)
        }
    }
}
def input = tasks.register('mineralogyOfficialInput', Jar) {
    inputs.file(sourceJar)
    archiveFileName = 'mineralogy-official-input.jar'
    destinationDirectory = layout.buildDirectory.dir('development-dependencies')
    from { zipTree(sourceJar) }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    doFirst {
        String digest = MessageDigest.getInstance('SHA-256').digest(sourceJar.bytes)
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        if (digest != sourceHash) throw new GradleException('The optional Mineralogy source jar changed')
    }
}
def mapped = renamer.classes(input) {
    map.from reverseMappings
    libraries.from sourceSets.main.compileClasspath
    naiveSrg = true
    accessTransformers = false
    output = layout.buildDirectory.file('development-dependencies/Mineralogy-6.1.4.116051-official.jar')
}
ext.prepareOfficialMineralogyDevelopment = tasks.register('prepareOfficialMineralogyDevelopment') {
    group = 'ide'
    description = 'Maps the exact optional Mineralogy reference to this branch’s official development names.'
    dependsOn mapped
}
