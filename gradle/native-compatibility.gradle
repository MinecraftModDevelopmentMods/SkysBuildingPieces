// The policy fixture is confined to tests. No legacy mod is bundled or required.
def policyClasses = layout.buildDirectory.dir('legacy-policy-fixture/classes')
def compilePolicy = tasks.register('compileLegacyPolicyFixture', JavaCompile) {
    source fileTree('src/compatibilityTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.runtimeClasspath)
    destinationDirectory = policyClasses
}
def policyJar = tasks.register('legacyPolicyFixtureJar', Jar) {
    dependsOn compilePolicy
    archiveFileName = 'legacy-piece-policy-fixture.jar'
    destinationDirectory = layout.buildDirectory.dir('legacy-policy-fixture')
    from policyClasses
    from 'src/compatibilityTest/resources'
}
def policyRunName = providers.gradleProperty('nativePolicyRunName').getOrElse('legacy-policy-test-run')
if (!(policyRunName ==~ /[a-z0-9-]+/)) {
    throw new GradleException('Use a simple disposable policy directory name')
}
def policyDirectory = layout.buildDirectory.dir(policyRunName)
def preparePolicy = tasks.register('prepareLegacyPolicyTest') {
    dependsOn policyJar, tasks.named('integrationTestModJar')
    doLast {
        File directory = policyDirectory.get().asFile
        if (directory.canonicalFile != new File(buildDir, policyRunName).canonicalFile) {
            throw new GradleException('Policy checks must remain inside their build directory')
        }
        if (directory.exists()) throw new GradleException('Preserve the existing policy evidence before another run: ' + directory)
        copy { from 'src/bootstrapTest/defaultconfigs'; into directory }
        copy {
            from policyJar.flatMap { it.archiveFile }
            from tasks.named('integrationTestModJar', Jar).flatMap { it.archiveFile }
            into new File(directory, 'mods')
        }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(directory, it).text = '[]\n'
        }
        new File(directory, 'server.properties').text = '''level-name=world
level-seed=4815162342
online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
spawn-animals=false
spawn-monsters=false
max-tick-time=120000
'''
    }
}
tasks.register('nativeInstalledPolicyTest', JavaExec) {
    dependsOn preparePolicy
    workingDir policyDirectory
    systemProperty 'skysbuildingpieces.integrationPhase', 'compat'
    project.ext.configureNativeBootstrapRun(delegate, 'runServer')
    doLast {
        File directory = policyDirectory.get().asFile
        project.ext.auditNativeServerLogs(directory, 'compat')
        File log = new File(directory, 'logs/latest.log')
        String text = log.isFile() ? log.getText('UTF-8') : ''
        if (!text.contains('BUILDING_PIECES_COMPATIBILITY_PASS installed_fixture=true') ||
                !text.contains('BUILDING_PIECES_PROBE_PASS compat') || !text.contains('Done (') ||
                text =~ /\/(?:ERROR|FATAL)\]/ || text.contains('[STDERR/') ||
                !fileTree(new File(directory, 'crash-reports')).isEmpty()) {
            throw new GradleException('Installed-mod policy checks did not complete cleanly')
        }
    }
}

def controlClasses = layout.buildDirectory.dir('optional-control/classes')
def compileControl = tasks.register('compileOptionalModControl', JavaCompile) {
    source fileTree('src/optionalControl/java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = controlClasses
}
def controlJar = tasks.register('optionalModControlJar', Jar) {
    dependsOn compileControl
    archiveFileName = 'optional-mod-control.jar'
    destinationDirectory = layout.buildDirectory.dir('optional-control')
    from controlClasses
    from 'src/optionalControl/resources'
}
tasks.register('captureDisabledMineralogyControl', JavaExec) {
    description = 'Checks optional mods on their own while Mineralogy slabs are disabled.'
    dependsOn controlJar, project.ext.verifyNativeOptionalRuntime
    workingDir layout.buildDirectory.dir('optional-disabled-control-run')
    project.ext.configureNativeBootstrapRun(delegate, 'runServer', false)
    doFirst {
        File directory = workingDir
        if (directory.canonicalFile != new File(buildDir, 'optional-disabled-control-run').canonicalFile) {
            throw new GradleException('Dependency control must remain inside its build directory')
        }
        if (directory.exists()) throw new GradleException('Preserve the existing dependency control evidence: ' + directory)
        copy { from 'src/bootstrapTest/defaultconfigs'; into directory }
        copy {
            from controlJar.flatMap { it.archiveFile }, project.ext.nativeOptionalDevelopmentJars.values()
            into new File(directory, 'mods')
        }
        File configuration = new File(directory, 'config/mineralogy-common.toml')
        configuration.parentFile.mkdirs()
        configuration.text = '[options]\nGENERATE_ROCKSLAB=false\n'
        new File(directory, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(directory, it).text = '[]\n'
        }
        new File(directory, 'server.properties').text = 'level-name=world\nonline-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nspawn-animals=false\nspawn-monsters=false\n'
    }
    doLast {
        File directory = workingDir
        project.ext.auditNativeServerLogs(directory, 'disabled-control')
        String text = new File(directory, 'logs/latest.log').getText('UTF-8')
        if (!text.contains('OPTIONAL_MOD_CONTROL_STARTED sky_mods=false') || !text.contains('Done (')) {
            throw new GradleException('Dependency control failed to reach a normal startup')
        }
        logger.lifecycle('DISABLED_MINERALOGY_CONTROL_PASS errors=0 sky_mods=false')
    }
}

def orderClasses = layout.buildDirectory.dir('coremod-order-checks/classes')
def compileOrders = tasks.register('compileCoremodOrderChecks', JavaCompile) {
    source fileTree('src/coremodTest/java')
    classpath = files(sourceSets.main.runtimeClasspath)
    destinationDirectory = orderClasses
}
tasks.register('verifyCoexistingCoremods', JavaExec) {
    dependsOn compileOrders, project.ext.verifyNativeOptionalRuntime, tasks.named('verifyGrassSlabsRelease')
    classpath = files(orderClasses, sourceSets.main.runtimeClasspath)
    mainClass = 'zone.moddev.mc.skysbuildingpieces.probe.CoremodOrderChecks'
    doFirst {
        args file('src/main/resources/coremods/skysbuildingpieces.js').absolutePath,
                project.ext.nativeOptionalDevelopmentJars.mineralogy.absolutePath,
                project.ext.nativeGrassDevelopmentJar.asFile.absolutePath
    }
}
