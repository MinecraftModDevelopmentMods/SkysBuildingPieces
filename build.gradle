def integrationRunDirectory = layout.buildDirectory.dir('integration-test-run')
def prepareIntegrationTest = tasks.register('prepareIntegrationTest') {
    group = 'verification'
    dependsOn integrationTestModJar
    doLast {
        File runDirectory = integrationRunDirectory.get().asFile
        if (runDirectory.canonicalFile != new File(buildDir, 'integration-test-run').canonicalFile) {
            throw new GradleException('Integration checks must remain inside the build directory')
        }
        if (runDirectory.exists()) throw new GradleException('Preserve the existing integration evidence: ' + runDirectory)
        copy { from 'src/bootstrapTest/defaultconfigs'; into runDirectory }
        File mods = new File(runDirectory, 'mods')
        mods.mkdirs()
        project.copy {
            from integrationTestModJar.flatMap { it.archiveFile }
            into mods
        }
        new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(runDirectory, 'server.properties').setText('''\
level-name=world
level-seed=skys-building-pieces-integration
level-type=default
online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
spawn-animals=false
spawn-monsters=false
spawn-protection=0
max-tick-time=120000
''', 'UTF-8')
    }
}

def createIntegrationProcess = { String phase, Object dependency ->
    tasks.register("integration${phase}Process", JavaExec) {
        group = 'verification'
        dependsOn dependency
        workingDir integrationRunDirectory
        systemProperty 'skysbuildingpieces.integrationPhase', phase.toLowerCase(Locale.ROOT)
        systemProperty 'log4j.configurationFile', file('src/integrationTest/resources/log4j2.xml').toURI().toString()
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            File marker = new File(integrationRunDirectory.get().asFile,
                    'world/skysbuildingpieces-integration.properties')
            if (!marker.isFile()) {
                throw new GradleException("${phase} integration marker is missing: ${marker}")
            }
            Properties values = new Properties()
            marker.withInputStream { values.load(it) }
            if (values.getProperty("${phase.toLowerCase(Locale.ROOT)}_complete") != 'true') {
                throw new GradleException("${phase} integration did not complete: ${marker}")
            }
        }
    }
}

def integrationFreshProcess = createIntegrationProcess('Fresh', prepareIntegrationTest)
def integrationReloadProcess = createIntegrationProcess('Reload', integrationFreshProcess)

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs the build-only legacy gameplay probe through fresh and reload servers.'
    dependsOn integrationReloadProcess
    doLast {
        File runDirectory = integrationRunDirectory.get().asFile
        File marker = new File(runDirectory, 'world/skysbuildingpieces-integration.properties')
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        ['fresh_complete', 'reload_complete', 'gameplay_checks', 'migration_checks'].each { key ->
            if (!values.getProperty(key)) throw new GradleException("Missing integration evidence ${key}")
        }
        List<File> crashReports = fileTree(new File(runDirectory, 'crash-reports')).files as List<File>
        if (!crashReports.isEmpty()) {
            throw new GradleException("Integration runtime produced crash reports: ${crashReports}")
        }
        File latest = new File(runDirectory, 'logs/latest.log')
        if (!latest.isFile() || latest.text.contains('Encountered an unexpected exception')) {
            throw new GradleException("Integration runtime log is missing or contains a server failure: ${latest}")
        }
    }
}

tasks.register('integrationClientProcess', JavaExec) {
    group = 'verification'
    dependsOn prepareIntegrationTest
    workingDir integrationRunDirectory
    systemProperty 'skysbuildingpieces.integrationPhase', 'client'
    systemProperty 'log4j.configurationFile', file('src/integrationTest/resources/log4j2.xml').toURI().toString()
