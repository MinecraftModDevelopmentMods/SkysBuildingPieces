def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) preferencesFile.withInputStream { preferences.load(it) }
        [
                'eclipse.preferences.version': '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir': '',
                'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings': 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it, 'Generated Buildship configuration.') }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn prepareEclipseResources
    doLast {
        ['runClient.launch', 'runServer.launch', 'runTestClient.launch', 'runTestServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("ForgeGradle did not generate ${name}")
            String contents = launch.getText('UTF-8')
            boolean production = name in ['runClient.launch', 'runServer.launch']
            if (production) {
                // Eclipse compiles into bin/main; use that same merged output
                // for both of Forge 40's discovery passes, including fresh edits.
                String roots = "${mod_id}%%${projectDir}/bin/main${File.pathSeparator}" +
                        "${mod_id}%%${projectDir}/bin/main"
                contents = contents.replaceAll(/key="MOD_CLASSES" value="[^"]*"/) {
                    'key="MOD_CLASSES" value="' + roots + '"'
                }
            }
            if (production && !contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>' +
                                System.lineSeparator() + '</launchConfiguration>')
            }
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                String prefix = option + ' '
                int start = contents.indexOf(prefix)
                if (start < 0) throw new GradleException("${name} is missing ${option}")
                start += prefix.length()
                int end = contents.indexOf(' --', start)
                if (end < 0) throw new GradleException("${name} has malformed ${option}")
                String value = contents.substring(start, end)
                if (value.find(/\s/) != null && !value.startsWith('&quot;')) {
                    contents = contents.substring(0, start) + '&quot;' + value + '&quot;' + contents.substring(end)
                }
            }
            launch.setText(contents, 'UTF-8')
        }
    }
}

tasks.named('genEclipseRuns') {
    finalizedBy configureEclipseBuildship, 'isolateEclipseProductionRuns'
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('genEclipseRuns'), tasks.named('eclipse')
    doLast {
        File prefsFile = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefsFile.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties prefs = new Properties()
        prefsFile.withInputStream { prefs.load(it) }
        if (file(prefs.getProperty('connection.gradle.user.home', '')).canonicalFile != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Eclipse Buildship uses the wrong Gradle home')
        }
        File metadata = file('bin/main/META-INF/mods.toml')
        String text = metadata.isFile() ? metadata.getText('UTF-8') : ''
        if (!text.contains("version=\"${project.mod_version}\"") ||
                !text.contains("versionRange=\"${project.minecraft_version_range}\"")) {
            throw new GradleException('Eclipse output contains incorrect mods.toml')
        }
        ['runClient.launch', 'runServer.launch', 'runTestClient.launch', 'runTestServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8')
            if (contents.contains('${MC_VERSION}')) {
                throw new GradleException("${name} retains ForgeGradle's unresolved MC_VERSION token")
            }
            if (!contents.contains('--main cpw.mods.bootstraplauncher.BootstrapLauncher') ||
                    !contents.contains("--fml.mcVersion ${project.minecraft_version} ")) {
                throw new GradleException("${name} must use the native launcher and Minecraft ${project.minecraft_version}")
            }
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                    contents.contains('src/test') || contents.contains('bin/test') || contents.contains('junit-')) {
                throw new GradleException("${name} exposes test code or dependencies")
            }
            def xml = new groovy.xml.XmlParser(false, false).parse(file(name))
            String modClasses = xml.mapAttribute.find {
                it.@key == 'org.eclipse.debug.core.environmentVariables'
            }.mapEntry.find { it.@key == 'MOD_CLASSES' }.@value
            List<String> roots = modClasses.split(java.util.regex.Pattern.quote(File.pathSeparator)).toList()
            if (roots.size() != 2 || roots[0] != roots[1] ||
                    roots[0].replace('\\', '/') != "${mod_id}%%${projectDir}/bin/main".replace('\\', '/')) {
                throw new GradleException("${name} must repeat the merged production output in MOD_CLASSES")
            }
        }
    }
}

