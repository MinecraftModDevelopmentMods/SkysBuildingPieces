name: Sky's Building Pieces 1.20.6 NeoForge CI

on:
  push:
    branches:
      - master-1.20.6-neo
  pull_request:
    branches:
      - master-1.20.6-neo

permissions:
  contents: read

concurrency:
  group: skysbuildingpieces-1.20.6-neo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-bootstrap:
    name: Cold NeoForge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target build metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "java_setup_version=$(sed -n 's/^java_setup_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "gradle_java_version=$(sed -n 's/^gradle_java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Java 21 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Check the Gradle JVM
        env:
          GRADLE_JAVA_MAJOR: ${{ steps.target.outputs.gradle_java_version }}
        run: java -version 2>&1 | grep -F "version \"$GRADLE_JAVA_MAJOR."

      - name: Bootstrap NeoForge from an empty cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysbuildingpieces-cold-gradle
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          gradle_args=(
            classes test
            --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

      - name: Verify same-cache bootstrap offline
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysbuildingpieces-cold-gradle
        run: |
          set -euo pipefail
          gradle_args=(
            classes test
            --rerun-tasks --offline --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target build metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "java_setup_version=$(sed -n 's/^java_setup_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "gradle_java_version=$(sed -n 's/^gradle_java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Java 21 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Check the Gradle JVM
        env:
          GRADLE_JAVA_MAJOR: ${{ steps.target.outputs.gradle_java_version }}
        run: java -version 2>&1 | grep -F "version \"$GRADLE_JAVA_MAJOR."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseArtifacts writeReleaseChecksums
          preparePackagedRuntimeProbes eclipse verifyEclipseConfiguration --no-daemon --stacktrace
          -Declipse.application=org.eclipse.ui.ide.workbench
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false

      - name: Test native fresh and reload servers
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          args=(--directory build/ci-native-probe --mode server
                --probe build/native-bootstrap-probe/building-pieces-native-checks.jar)
          python3 tools/run_development_checks.py "${args[@]}" --phase fresh --fresh
          python3 tools/run_development_checks.py "${args[@]}" --phase reload

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-1.20.6-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysBuildingPieces-0.3.8.120062.jar
            build/libs/SkysBuildingPieces-0.3.8.120062-sources.jar
            build/libs/SkysBuildingPieces-0.3.8.120062-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-1.20.6-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/ci-native-probe/*-console.log
            build/ci-native-probe/logs/**
            build/problems/**
