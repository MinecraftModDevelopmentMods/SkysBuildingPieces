name: Sky's Building Pieces 26.3 CI

on:
  push:
    branches:
      - master-26.3
      - 'feature/**'
  pull_request:
    branches:
      - master-26.3

permissions:
  contents: read

concurrency:
  group: skysbuildingpieces-26.3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-forge-bootstrap:
    name: Cold Forge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 25 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Pin production Java
        run: |
          echo "SBP_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Bootstrap Forge from an empty cache
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skysbuildingpieces-cold-gradle
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          gradle_args=(
            classes test
            --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

      - name: Verify same-cache bootstrap offline
        shell: bash
        env:
          ORESPAWN_MAVENIZER_OFFLINE: 'true'
          GRADLE_USER_HOME: ${{ runner.temp }}/skysbuildingpieces-cold-gradle
        run: |
          set -euo pipefail
          gradle_args=(
            classes test
            --rerun-tasks --offline --no-daemon --no-build-cache --stacktrace --max-workers=2
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew "${gradle_args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read target Java metadata
        id: target
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" gradle.properties; }
          test "$(value java_toolchain_version)" = "$(value gradle_java_toolchain_version)"
          echo "java_setup_version=$(value java_setup_version)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Java 25 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java_setup_version }}

      - name: Pin production Java for coordinated builds
        shell: bash
        run: |
          set -euo pipefail
          for prefix in SGS SBP STS; do
            echo "${prefix}_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Read coordinated Grass Slabs source pin
        id: grass
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^source.commit=//p' gradle/grass-slabs-release.properties)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Grass Slabs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/SkysGrassSlabs
          ref: ${{ steps.grass.outputs.commit }}
          path: .gradle/qualification-sources/grass-slabs

      - name: Build pinned optional Grass Slabs dependency
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.gradle/qualification-sources/grass-slabs"
          chmod +x "$dependency/gradlew"
          "$dependency/gradlew" -p "$dependency" assemble --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          version="$(sed -n 's/^version=//p' gradle/grass-slabs-release.properties)"
          echo "ORG_GRADLE_PROJECT_grassSlabsMainJar=$dependency/build/libs/SkysGrassSlabs-$version.jar" >> "$GITHUB_ENV"

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew clean check integrationTest build javadoc verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath --no-daemon --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false

      - name: Replay artifact checks offline
        env:
          ORESPAWN_MAVENIZER_OFFLINE: 'true'
        run: >-
          ./gradlew assemble verifyReleaseArtifacts writeReleaseChecksums --offline --no-daemon --stacktrace
          -Dorg.gradle.java.installations.paths="$JAVA_HOME"

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-26.3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysBuildingPieces-0.3.8.2603001.jar
            build/libs/SkysBuildingPieces-0.3.8.2603001-sources.jar
            build/libs/SkysBuildingPieces-0.3.8.2603001-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-26.3-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/*-run/**/*.properties
            build/problems/**
